name: Engineering release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed engineering tag on main
        required: true
      ci_run_id:
        description: Successful CI run for the exact tagged commit
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: engineering-release
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      CI_RUN: ${{ inputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify signature, source and gates
        run: |
          node -e "if(!/^v[0-9]+[.][0-9]+[.][0-9]+$/.test(process.env.TAG)||!/^\\d+$/.test(process.env.CI_RUN))process.exit(1)"
          git fetch origin tag "$TAG"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=infra/release/allowed_signers verify-tag "$TAG"
          git checkout --detach "$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          gh run view "$CI_RUN" --json headSha,conclusion,workflowName,event > /tmp/ci-gate.json
          node scripts/verify-release-source.mjs /tmp/ci-gate.json
      - name: Retrieve tested artifacts
        run: gh run download "$CI_RUN" --dir delivery
      - name: Deliver engineering baseline
        run: |
          tar -czf engineering-baseline.tar.gz -C delivery engineering-baseline
          gh release create "$TAG" engineering-baseline.tar.gz delivery/image-*/* --verify-tag --prerelease --title "LARA $TAG engineering baseline" --notes-file docs/development/ENGINEERING-RELEASE.md
