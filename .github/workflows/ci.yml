name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.5}
      - uses: actions/setup-node@v4
        with: {node-version: '24.16.0', cache: pnpm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: git diff --exit-code -- apps/web/public/assets/lara
      - run: pnpm audit --prod --audit-level low
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: node scripts/ci-database.mjs
      - run: python3 docs/development/validate_specifications.py
      - run: python3 -m unittest scripts/test_build_status.py
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/release-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-baseline
          path: |
            apps/web/.next
            apps/web/public
            apps/api/src
            apps/worker/src
            packages
            scripts
            infra
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            docs/development
            README.md
            status
            .local/release-manifest.json
            !**/node_modules/**
            !**/.env*
          include-hidden-files: true

  image:
    strategy:
      fail-fast: false
      matrix:
        target: [web, api, worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BUILD_COMMIT=${{ github.sha }} -f infra/containers/Dockerfile --target ${{ matrix.target }} -t lara:${{ matrix.target }} .
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: lara:${{ matrix.target }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: lara:${{ matrix.target }}
          format: cyclonedx
          output: ${{ matrix.target }}-sbom.json
          skip-setup-trivy: true
      - run: |
          docker inspect --format '{{.Id}}' lara:${{ matrix.target }} > ${{ matrix.target }}-image-id.txt
          docker save lara:${{ matrix.target }} | gzip > ${{ matrix.target }}-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.target }}
          path: |
            *-sbom.json
            *-image-id.txt
            *-image.tar.gz
